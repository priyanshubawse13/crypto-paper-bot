name: sample-futures-data
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas pyarrow
      - run: python -m simex.fetch_data --start 2024-01 --symbols SOL,BTC,DOGE
      - name: keep only Jan-Mar 2024 + filters for local development
        run: |
          python - <<'PY'
          import pandas as pd, glob
          for f in glob.glob("data_fut/*_1m.parquet") + glob.glob("data_fut/*_mark1m.parquet") + glob.glob("data_fut/*_funding.parquet"):
              d = pd.read_parquet(f); d = d[(d.t >= 1704067200000) & (d.t < 1711929600000)]; d.to_parquet(f, compression="zstd", index=False)
          PY
          ls -la data_fut
          git config user.name paper-bot; git config user.email paper-bot@users.noreply.github.com
          git checkout --orphan sample-futures; git rm -rq --cached .; git add -f data_fut; git commit -qm sample; git push -f origin sample-futures
