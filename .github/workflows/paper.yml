name: paper-trade

on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"   # 7 min after every 4H candle closes (UTC)
  workflow_dispatch: {}                 # "Run workflow" button for a manual run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Advance paper ledgers and build dashboard
        run: python -m paperbot.run_live
      - name: Save state and dashboard
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state site DASHBOARD.md
          git diff --cached --quiet || git commit -m "paper run $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --quiet || true
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes site/ to https://priyanshubawse13.github.io/crypto-paper-bot/
  # (needs: repo public + Settings -> Pages -> Source: GitHub Actions). Fails harmlessly until then.
  pages:
    needs: run
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
